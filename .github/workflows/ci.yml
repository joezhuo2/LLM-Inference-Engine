name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

jobs:
  cpu:
    name: CPU build + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y ninja-build pkg-config libgtest-dev nlohmann-json3-dev libcli11-dev libsentencepiece-dev
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja googletest nlohmann-json cli11
      - run: cmake --preset cpu
      - run: cmake --build --preset cpu
      - run: ctest --preset cpu -LE todo_joe

  cuda-compile:
    name: CUDA compile check (no GPU)
    runs-on: ubuntu-24.04
    container: nvcr.io/nvidia/cuda:13.3.1-devel-ubuntu24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get $APT_OPTS update && apt-get $APT_OPTS install -y cmake ninja-build git pkg-config libgtest-dev nlohmann-json3-dev libcli11-dev libsentencepiece-dev
      - run: cmake --preset release -DCMAKE_CUDA_ARCHITECTURES="120;89;75"
      - run: cmake --build --preset release

  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18 unless the runner already has it
        run: clang-format --version 2>/dev/null | grep -q 'version 18\.' || (sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y clang-format)
      - run: clang-format --version
      - run: |
          files=$(git ls-files '*.cpp' '*.h' '*.cu' '*.cuh')
          [ -z "$files" ] || clang-format --dry-run --Werror $files

  python:
    name: Python syntax check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git ls-files '*.py' | xargs -r python3 -m py_compile
